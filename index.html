<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Moul&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Battambang&family=Moul&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>បញ្ជីសៀវភៅ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', "Battambang", system-ui, Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #d5d7d6ec;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- PAGE LOADER STYLES --- */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #d5d7d6ec;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #e0e0e0;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            margin-top: 20px;
            font-family: "Battambang", sans-serif;
            color: #2c3e50;
            font-size: 1.2rem;
            font-weight: bold;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        /* ------------------------- */

        .hero {
            background-color: #2c3e50;
            color: white;
            width: 100%;
            padding: 0.8rem 0.6rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .hero h3 {
            margin-top: 0;
            font-size: 1.6rem;
            font-family: "Moul";
            padding-bottom: -30px;
        }

        .hero p {
            font-family: "Battambang";
            font-size: 1.2rem;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: -25px auto 0 auto;
            width: 90%;
        }

        #searchInput {
            width: 90%;
            padding: 16px 25px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: #3498db;
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.2);
        }

        #resultsContainer {
            width: 90%;
            max-width: 600px;
            margin-top: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: none; 
            max-height: 400px;
            overflow-y: auto;
        }

        .class-item {
            padding: 15px 25px;
            border-bottom: 1px solid #eee;
            color: #333;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .class-item:last-child {
            border-bottom: none;
        }

        .class-item:hover {
            background-color: #f0f8ff;
            color: #3498db;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            color: #888;
            font-style: italic;
        }

        /* --- WIDE STUDENT PANEL STYLES --- */
        .panel-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .student-panel {
            background: rgba(234, 233, 233, 0.97);
            width: 98%;
            max-width: 1400px; 
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 95vh;
            animation: slideIn 0.3s ease-out;
            font-family: 'Battambang';
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .panel-header {
            background: #3498db;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .close-btn {
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .panel-content {
            padding: 0;
            overflow-x: auto;
            overflow-y: auto;
            flex-grow: 1;
        }

        .student-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 5px 4px;
            min-width: max-content;
        }

        .student-item:hover {
            background-color: #b8cde1;
        }

        /* Sticky Student Column */
        .student-info {
            height: 60px;
            display: flex;
            align-items: center;
            width: 150px;
            flex-shrink: 0;
            position: sticky;
            left: 0;
            background: rgb(236, 235, 235); 
            z-index: 2;
            padding-right: 5px;
            box-shadow: 4px 0 6px -2px rgba(0,0,0,0.05);
            font-size: 0.9rem;
            border-radius: 6px;
        }

        .student-item:hover .student-info {
            background-color: #fafafa;
        }

        .student-avatar {
            width: 30px; height: 30px;
            background: #eef7fe;
            color: #3498db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 3px;
            flex-shrink: 0;
        }

        .student-name {
            font-weight: 600;
            color: #1e1e1e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Subjects Container */
        .subjects-container {
            display: flex;
            gap: 12px;
            padding-left: 10px;
        }

        .subject-attendance {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 105px;
        }

        .subject-label {
            font-size: 0.9rem;
            color: #414141;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .attendance-select, .attendance-input {
            padding: 6px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
            font-weight: 500;
            font-size: 0.9rem;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
        }

        .attendance-select {
            cursor: pointer;
        }

        .attendance-input {
            background-color: #ffffff;
            color: #333;
            max-width: 120px;
        }

        .attendance-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .attendance-select.no-select {
            background-color: #f8f9fa;
            color: #7f8c8d;
            border-color: #dcdde1;
        }

        .attendance-select.attendant {
            background-color: #e8f8f5;
            color: #27ae60;
            border-color: #27ae60;
        }

        .attendance-select.returnbook {
            background-color: #e8f2f8;
            color: #275fae;
            border-color: #275fae;
        }

        .attendance-select.absent {
            background-color: #fde8e8;
            color: #e74c3c;
            border-color: #e74c3c;
        }

        .attendance-select.oldbook {
            background-color: #f0f0dd;
            color: #787207;
            border-color: #787207;
        }

        .panel-footer {
            padding: 15px 25px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 8px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            color: white;
        }

        .pdf-btn {
            background: #e74c3c;
        }

        .pdf-btn:hover {
            background: #c0392b;
        }

        .excel-btn {
            background: #1e8449;
        }

        .excel-btn:hover {
            background: #145a32;
        }

        .save-btn {
            background: #3498db;
            font-size: 1rem;
            margin-left: 20px;
        }
        
        .save-btn1 {
            background: #3498db;
            font-size: 1rem;
            margin-left: 20px;
        }


        .save-btn:hover {
            background: #28648b;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* --- CUSTOM POPUP STYLES --- */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideIn 0.3s ease-out;
            font-family: 'Battambang', sans-serif;
        }

        .popup-box p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* --- DOWNLOAD OVERLAY STYLES --- */
        .download-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 10001;
            justify-content: center;
            align-items: center;
        }

        .download-box {
            background: white;
            padding: 30px 35px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 320px;
            width: 85%;
            animation: slideIn 0.3s ease-out;
            font-family: 'Battambang', sans-serif;
        }

        .download-icon-wrap {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .download-icon-wrap.pdf {
            background: #fde8e8;
            color: #e74c3c;
        }

        .download-icon-wrap.excel {
            background: #e6f4ea;
            color: #1e8449;
        }

        .download-icon-wrap i {
            font-size: 1.8rem;
            animation: bounceDown 1s infinite ease-in-out;
        }

        @keyframes bounceDown {
            0%, 100% { transform: translateY(-4px); opacity: 0.7; }
            50% { transform: translateY(4px); opacity: 1; }
        }

        .download-box p {
            font-size: 1.05rem;
            color: #333;
            margin: 0 0 16px 0;
            font-weight: bold;
        }

        .download-progress-track {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        .download-progress-bar {
            height: 100%;
            width: 40%;
            border-radius: 10px;
            background: #3498db;
            animation: progressSlide 1.1s infinite ease-in-out;
        }

        .download-progress-bar.pdf-color {
            background: #e74c3c;
        }

        .download-progress-bar.excel-color {
            background: #1e8449;
        }

        @keyframes progressSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
    </style>
</head>
<body>

    <!-- PAGE LOADER ANIMATION -->
    <div id="pageLoader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">សូមរង់ចាំ....</div>
    </div>

    <!-- CUSTOM POPUP OVERLAY -->
    <div id="customPopup" class="popup-overlay">
        <div class="popup-box">
            <p id="popupMessage"></p>
            <button class="btn save-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <!-- DOWNLOAD ANIMATION OVERLAY -->
    <div id="downloadOverlay" class="download-overlay">
        <div class="download-box">
            <div id="downloadIconWrap" class="download-icon-wrap">
                <i id="downloadIcon" class="fa-solid fa-file-arrow-down"></i>
            </div>
            <p id="downloadMessage">កំពុងទាញយក...</p>
            <div class="download-progress-track">
                <div id="downloadProgressBar" class="download-progress-bar"></div>
            </div>
        </div>
    </div>



    <div class="hero">
        <h3>វិទ្យាល័យ ហ៊ុនសែន មិត្តភាព</h3>
        <p>បញ្ជីខ្ចីសងសៀវភៅ(ថ្នាក់ទី៧, ៨ និង៩) ២០២៦~២០២៧</p>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ស្វែងរកថ្នាក់ 7A, 7B,...">
    </div>

    <div id="resultsContainer"></div>

    <!-- STUDENT PANEL -->
    <div id="studentPanelOverlay" class="panel-overlay">
        <div class="student-panel">
            <div class="panel-header">
                <h2 id="panelClassTitle">Class Roster</h2>
                <span class="close-btn" id="closePanelBtn">&times;</span>
            </div>

            <div class="panel-content" id="studentListContainer"></div>

            <div class="panel-footer">
                <button class="btn pdf-btn" id="pdfBtn">PDF <i class="fa-solid fa-file-pdf"></i></button>
                <button class="btn excel-btn" id="excelBtn">Excel <i class="fa-solid fa-file-excel"></i></button>
                <button class="btn save-btn" id="saveBtn">Save <i class="fa-solid fa-book"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Custom Pop-up Functions
        function showPopup(message) {
            document.getElementById('popupMessage').textContent = message;
            document.getElementById('customPopup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('customPopup').style.display = 'none';
        }

        // 📍 REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxiZXSY6CfzvXIVfpB8hXg8PNdtofMOktT6XFT4CfvW8JkJ8aP5FZeNlUqE9KMizb1NFg/exec";

        const subjects = [
            "ខ្មែរ(ខ្ចី)","ខ្មែរ(សង)", "គណិត(ខ្ចី)", "គណិត(សង)", "សិក្សាសង្គម(ខ្ចី)", "សិក្សាសង្គម(សង)", "វិទ្យាសាស្ត្រ(ខ្ចី)",
            "វិទ្យាសាស្ត្រ(សង)",  "អង់គ្លេស(ខ្ចី)", "អង់គ្លេស(សង)","ផ្សេងៗ"
        ];

        let classes = [];
        let studentData = {}; 
        let currentSelectedClass = "";
        const attendanceData = {};

        // Fetch Data from Google Apps Script Web App
        async function loadDataFromAppsScript() {
            const loader = document.getElementById('pageLoader');
            try {
                const response = await fetch(WEB_APP_URL);
                studentData = await response.json();
                classes = Object.keys(studentData);
                console.log("Sheet data & attendance loaded successfully!");
            } catch (error) {
                console.error("Error loading sheet data:", error);
                showPopup("No internet🛜 Please check!");
            } finally {
                // Hide loader once the data fetch is complete
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 400); // Wait for transition to complete
                }
            }
        }

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const panelOverlay = document.getElementById('studentPanelOverlay');
        const closePanelBtn = document.getElementById('closePanelBtn');
        const panelClassTitle = document.getElementById('panelClassTitle');
        const studentListContainer = document.getElementById('studentListContainer');
        const saveBtn = document.getElementById('saveBtn');
        const pdfBtn = document.getElementById('pdfBtn');
        const excelBtn = document.getElementById('excelBtn');

        // Download overlay elements
        const downloadOverlay = document.getElementById('downloadOverlay');
        const downloadIconWrap = document.getElementById('downloadIconWrap');
        const downloadIcon = document.getElementById('downloadIcon');
        const downloadMessage = document.getElementById('downloadMessage');
        const downloadProgressBar = document.getElementById('downloadProgressBar');

        function showDownloadOverlay(type) {
            downloadIconWrap.classList.remove('pdf', 'excel');
            downloadProgressBar.classList.remove('pdf-color', 'excel-color');

            if (type === 'pdf') {
                downloadIconWrap.classList.add('pdf');
                downloadProgressBar.classList.add('pdf-color');
                downloadIcon.className = 'fa-solid fa-file-pdf';
                downloadMessage.textContent = 'កំពុងទាញយក PDF...';
            } else {
                downloadIconWrap.classList.add('excel');
                downloadProgressBar.classList.add('excel-color');
                downloadIcon.className = 'fa-solid fa-file-excel';
                downloadMessage.textContent = 'កំពុងទាញយក Excel...';
            }

            downloadOverlay.style.display = 'flex';
        }

        function hideDownloadOverlay() {
            downloadOverlay.style.display = 'none';
        }
// Detect if opened inside Telegram, Facebook, Messenger, Instagram, or Line
function isInAppBrowser() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    return (ua.includes("FBAN") || ua.includes("FBAV") || 
            ua.includes("Telegram") || ua.includes("Line") || 
            ua.includes("Instagram"));
}

// Extracts direct export URL from Google Apps Script
async function resolveExportUrl(action, sheetName) {
    const scriptUrl = `${WEB_APP_URL}?action=${action}&sheetName=${encodeURIComponent(sheetName)}`;
    const response = await fetch(scriptUrl);
    const directUrl = await response.text();

    if (!directUrl || !directUrl.startsWith('http')) {
        throw new Error('Could not resolve the download link.');
    }
    return directUrl.trim();
}

// Mobile-optimized download trigger (Same Tab)
async function triggerDownload(action, type, sheetName) {
    // Alert user if they are using Telegram/Facebook built-in browser
    if (isInAppBrowser()) {
        showPopup('In-app browsers (Telegram/Facebook) block downloads. Please tap the top menu (⋮ or ...) and select "Open in Chrome" or "Open in Safari"!');
        return;
    }

    showDownloadOverlay(type);

    try {
        const directUrl = await resolveExportUrl(action, sheetName);

        // Mobile Safari / Chrome reliable download element
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = directUrl;
        downloadAnchor.target = '_self'; // Ensures no new tab opens
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);

    } catch (err) {
        console.error(err);
        showPopup('Download failed. Please check your internet and try again!');
    } finally {
        setTimeout(hideDownloadOverlay, 1500);
    }
}
        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (query === "") {
                resultsContainer.style.display = 'none';
                return;
            }

            const filteredClasses = classes.filter(c => c.toLowerCase().includes(query));
            resultsContainer.innerHTML = '';

            if (filteredClasses.length > 0) {
                filteredClasses.forEach(className => {
                    const div = document.createElement('div');
                    div.className = 'class-item';
                    div.textContent = className;
                    
                    div.addEventListener('click', () => {
                        searchInput.value = '';
                        resultsContainer.style.display = 'none';
                        openStudentPanel(className);
                    });
                    
                    resultsContainer.appendChild(div);
                });
            } else {
                resultsContainer.innerHTML = '<div class="no-results">No classes found.</div>';
            }
            resultsContainer.style.display = 'block';
        });

        function openStudentPanel(className) {
            currentSelectedClass = className;
            panelClassTitle.textContent = `បញ្ជីសៀវភៅថ្នាក់ទី ${className} ឆ្នាំ 2026~27`;
            renderStudentList();
            panelOverlay.style.display = 'flex';
        }

        function renderStudentList() {
            studentListContainer.innerHTML = '';
            const students = studentData[currentSelectedClass] || [];

            if (!attendanceData[currentSelectedClass]) {
                attendanceData[currentSelectedClass] = {};
            }

        

            students.forEach(student => {
                const studentId = student.id;
                const studentName = student.name;
                const savedAttendanceObj = student.attendance || {};

                const studentDiv = document.createElement('div');
                studentDiv.className = 'student-item';

                // Sticky Info
                const infoDiv = document.createElement('div');
                infoDiv.className = 'student-info';

                const avatar = document.createElement('div');
                avatar.className = 'student-avatar';
                avatar.innerHTML = `
                <i class="fa-solid fa-id-badge"></i>
                `;

                const nameSpan = document.createElement('span');
                nameSpan.className = 'student-name';
                nameSpan.textContent = studentName;

                infoDiv.appendChild(avatar);
                infoDiv.appendChild(nameSpan);
                studentDiv.appendChild(infoDiv);

                // Subjects Container
                const subjectsContainer = document.createElement('div');
                subjectsContainer.className = 'subjects-container';

                subjects.forEach(subject => {
                    if (!attendanceData[currentSelectedClass][subject]) {
                        attendanceData[currentSelectedClass][subject] = {};
                    }

                    const subjectBlock = document.createElement('div');
                    subjectBlock.className = 'subject-attendance';

                    const subjectLabel = document.createElement('span');
                    subjectLabel.className = 'subject-label';
                    subjectLabel.textContent = subject;

                    // Load saved status from local user changes OR database
                    if (attendanceData[currentSelectedClass][subject][studentId] === undefined) {
                        const dbStatus = savedAttendanceObj[subject] || null;
                        attendanceData[currentSelectedClass][subject][studentId] = dbStatus;
                    }

                    const currentStatus = attendanceData[currentSelectedClass][subject][studentId];

                    // Render Text Input for "ផ្សេងៗ", Select Dropdown for others
                    if (subject === "ផ្សេងៗ") {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'attendance-input';
                        input.placeholder = 'បញ្ចូល...';
                        input.value = currentStatus || '';

                        input.addEventListener('input', (e) => {
                            const val = e.target.value.trim();
                            attendanceData[currentSelectedClass][subject][studentId] = (val === '') ? null : val;
                        });

                        subjectBlock.appendChild(subjectLabel);
                        subjectBlock.appendChild(input);
                    } else {
                        const select = document.createElement('select');
                        select.className = 'attendance-select';

                        const optNoSelect = document.createElement('option');
                        optNoSelect.value = 'null';
                        optNoSelect.textContent = 'ជ្រើសរើស';
                        select.appendChild(optNoSelect);

                        // Dynamic options based on subject type
                        if (subject.includes('(សង)')) {
                            const optBat = document.createElement('option');
                            optBat.value = '1';
                            optBat.textContent = 'សង';

                            const optSong = document.createElement('option');
                            optSong.value = '0';
                            optSong.textContent = 'បាត់';

                            select.appendChild(optBat);
                            select.appendChild(optSong);
                        } else {
                            const optThmei = document.createElement('option');
                            optThmei.value = 'ថ្មី';
                            optThmei.textContent = 'ថ្មី';

                            const optChas = document.createElement('option');
                            optChas.value = 'ចាស់';
                            optChas.textContent = 'ចាស់';

                            select.appendChild(optThmei);
                            select.appendChild(optChas);
                        }

                        const selectStatus = currentStatus || 'null';
                        select.value = selectStatus;
                        updateSelectColor(select, selectStatus);

                        select.addEventListener('change', (e) => {
                            const val = e.target.value;
                            attendanceData[currentSelectedClass][subject][studentId] = (val === 'null') ? null : val;
                            updateSelectColor(select, val);
                        });

                        subjectBlock.appendChild(subjectLabel);
                        subjectBlock.appendChild(select);
                    }

                    subjectsContainer.appendChild(subjectBlock);
                });

                studentDiv.appendChild(subjectsContainer);
                studentListContainer.appendChild(studentDiv);
            });
        }

        function updateSelectColor(selectElement, status) {
            selectElement.classList.remove('attendant', 'absent', 'oldbook','returnbook', 'no-select');
            if (status === 'ថ្មី' || status === '') {
                selectElement.classList.add('attendant');
            } else if (status === '0' ) {
                selectElement.classList.add('absent');
            } else if (status === 'ចាស់' ) {
                selectElement.classList.add('oldbook');  
             } else if (status === '1' ) {
                selectElement.classList.add('returnbook');        
            } else {
                selectElement.classList.add('no-select');
            }
        }

        pdfBtn.addEventListener('click', () => {
            if (!currentSelectedClass) return;
            triggerDownload('exportPdf', 'pdf', currentSelectedClass);
        });

        excelBtn.addEventListener('click', () => {
            if (!currentSelectedClass) return;
            triggerDownload('exportExcel', 'excel', currentSelectedClass);
        });

      saveBtn.addEventListener('click', async () => {
            const records = [];
            const classObj = attendanceData[currentSelectedClass] || {};

            for (const subject in classObj) {
                for (const studentId in classObj[subject]) {
                    const status = classObj[subject][studentId];
                    
                    // Allow both filled statuses and 'null' (cleared) statuses to be processed
                    if (status !== undefined) {
                        const studentObj = (studentData[currentSelectedClass] || []).find(s => s.id == studentId);
                        const sName = studentObj ? studentObj.name : "";
                        records.push({ 
                            studentId: Number(studentId), 
                            studentName: sName, 
                            subject: subject, 
                            // If status is null (cleared text), send an empty string to clear the Sheet
                            status: status === null ? "" : status 
                        });
                    }
                }
            }

            if (records.length === 0) {
                showPopup('Please select attendance status for at least one student.');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = 'Saving... <i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ className: currentSelectedClass, records: records }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const res = await response.json();

                if (res.success) {
                    showPopup(`Successfully saved ✔️ Thanks!`);
                    await loadDataFromAppsScript();
                   // panelOverlay.style.display = 'none';
                } else {
                    showPopup('Error saving data: ' + res.error);
                }
            } catch (err) {
                console.error(err);
                showPopup('Failed to save ✖️ Try again!');
            } finally {
                saveBtn.disabled = false;
               saveBtn.innerHTML = 'Save <i class="fa-solid fa-book"></i>';
            }
        });

        closePanelBtn.addEventListener('click', () => panelOverlay.style.display = 'none');
        panelOverlay.addEventListener('click', (e) => {
            if (e.target === panelOverlay) panelOverlay.style.display = 'none';
        });

        loadDataFromAppsScript();
    </script>
</body>
</html>
